name: Build myxaxGram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_ROOT: ${{ github.workspace }}/cherrygram
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK environment
        run: |
          SDK="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK" ]; then
            echo "error: preinstalled Android SDK not found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # Prefer the newest installed cmdline-tools.
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$CMDLINE" ]; then
            echo "$CMDLINE" >> "$GITHUB_PATH"
          fi
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android components
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "error: sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache
          echo "MYXAX_CMAKE=$SDK/cmake/3.22.1/bin/cmake" >> "$GITHUB_ENV"

      - name: Assemble source tree
        run: bash scripts/integrate.sh

      - name: Write signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "error: RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$BUILD_ROOT/app/release.keystore"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.BUILD_ROOT }}/app
        env:
          CHAQUOPY_BUILD_PYTHON: python3
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -PIS_PRIVATE=false \
            --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find "$BUILD_ROOT/app/TMessagesProj_AppStandalone/build/outputs/apk" \
            -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK" ]; then
            echo "error: no APK produced" >&2
            exit 1
          fi
          DEST="$RUNNER_TEMP/myxaxGram.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myxaxGram-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: myxaxGram 1.0.0 (build ${{ github.run_number }})
          body: |
            Automatic build of myxaxGram (Telegram 13.1.1 + Cherrygram 11.4.0
            with the exteraless Python plugin engine).

            Signed with the release key. arm64-v8a only.
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
