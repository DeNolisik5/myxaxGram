// myxaxGram: Python plugin runtime (Chaquopy).
//
// This file is applied from TMessagesProj/build.gradle after the Android
// library plugin. Chaquopy lives in this library module (not in the app
// module) because the whole plugin engine is here; Chaquopy allows exactly
// one module per app.
//
// The prebuilt Chaquopy native libraries are replaced with builds made from
// the exteraless fork (see buildChaquopyRuntime* below): the fork adds the
// JNI entry points the plugin bridge relies on.

import com.chaquo.python.internal.Common

apply plugin: 'com.chaquo.python'

android {
    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'
        }

        // Deprecated Groovy DSL, still supported by Chaquopy 17 and used by
        // the upstream plugin tree.
        python {
            version '3.11'
            def pyBuild = System.getenv('CHAQUOPY_BUILD_PYTHON')
            if (pyBuild != null && !pyBuild.isBlank()) {
                buildPython pyBuild
            }
            pip {
                install 'beautifulsoup4'
                install 'debugpy'
                install 'lxml'
                install 'packaging'
                install 'pillow'
                install 'requests'
                install 'PyYAML'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Plugin engine: Xposed-compatible hooks (LSPlant), MVEL filters and
    // runtime class generation.
    implementation 'com.aliucord:Aliuhook:1.1.4'
    implementation 'org.mvel:mvel2:2.5.2.Final'
    implementation 'com.linkedin.dexmaker:dexmaker:2.28.6'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}

def chaquopyPythonVersion = '3.11'
def chaquopySourceDir = file('chaquopy')
def chaquopyRuntimeDir = layout.buildDirectory.dir('chaquopy/runtime').get().asFile
def chaquopyTarget = com.chaquo.python.internal.Common.PYTHON_VERSIONS.find {
    it.key.startsWith("${chaquopyPythonVersion}.")
}
def chaquopyBuildPython = System.getenv('CHAQUOPY_BUILD_PYTHON')
def chaquopyAbis = android.defaultConfig.ndk.abiFilters.sort(false)

def chaquopyRuntimeTasks = chaquopyAbis.collect { String abi ->
    tasks.register("buildChaquopyRuntime${abi.split(/[-_]/)*.capitalize().join()}", Exec) {
        def targetZip = configurations.detachedConfiguration(dependencies.create(
                "com.chaquo.python:target:${chaquopyTarget.key}-${chaquopyTarget.value}:${abi}@zip"))
        def outputDir = new File(chaquopyRuntimeDir, abi)
        inputs.files(fileTree(chaquopySourceDir) {
            include 'exteraless/build.sh'
            include 'product/runtime/CMakeLists.txt'
            include 'product/runtime/src/main/c/**'
            include 'product/runtime/src/main/python/**/*.pyx'
            include 'product/runtime/src/main/python/**/*.pxi'
            include 'product/runtime/src/main/python/**/*.pxd'
        }).withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.files(targetZip).withPathSensitivity(PathSensitivity.NAME_ONLY)
        outputs.dir(outputDir)
        commandLine 'bash', new File(chaquopySourceDir, 'exteraless/build.sh').path
        environment('ABI', abi)
        environment('OUT', outputDir.path)
        environment('WORKSPACE', layout.buildDirectory.dir('chaquopy/work').get().asFile.path)
        environment('PYTHON', chaquopyBuildPython ?: 'python3')
        environment('PYTHON_VERSION', chaquopyPythonVersion)
        environment('CMAKE_POLICY_VERSION_MINIMUM', '3.5')
        doFirst {
            if (!new File(chaquopySourceDir, 'product/runtime').isDirectory()) {
                throw new GradleException('Chaquopy sources are missing: expected TMessagesProj/chaquopy')
            }
            environment('NDK', androidComponents.sdkComponents.ndkDirectory.get().asFile.path)
            environment('PYTHON_TARGET_ZIP', targetZip.singleFile.path)
            def cmakeBin = System.getenv('MYXAX_CMAKE')
            if (cmakeBin != null && !cmakeBin.isBlank()) {
                environment('CMAKE', cmakeBin)
            }
        }
    }
}

def overrideChaquopyRuntime = { task, String fileName, Closure<File> targetFor ->
    task.doLast {
        chaquopyAbis.each { String abi ->
            def target = targetFor(task.outputDir.get().asFile, abi)
            if (target.isDirectory()) {
                copy {
                    from new File(chaquopyRuntimeDir, "$abi/$fileName")
                    into target
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /generate\w+PythonMiscAssets|generate\w+PythonJniLibs/) {
        task.inputs.files(chaquopyRuntimeTasks)
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        if (task.name ==~ /generate\w+PythonMiscAssets/) {
            overrideChaquopyRuntime(task, 'chaquopy.so') { File out, String abi ->
                new File(out, "chaquopy/bootstrap-native/$abi/java")
            }
        } else if (task.name ==~ /generate\w+PythonJniLibs/) {
            overrideChaquopyRuntime(task, 'libchaquopy_java.so') { File out, String abi ->
                new File(out, abi)
            }
        }
    }
}
